name: Node.js CI

on:
  pull_request:
    branches:
      - next
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # Disable husky hooks in CI to speed up pnpm install

    strategy:
      matrix:
        node-version: [24.0.0]

    steps:
      # =======================================================================
      # STEP 1: INITIALIZE ENVIRONMENT
      # =======================================================================
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required to allow 'git checkout' of other branches
          fetch-depth: 0
          clean: true

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # =======================================================================
      # STEP 2: GENERATE BASELINE (The Folder Swap)
      # =======================================================================
      - name: Generate Deprecation Baseline from Target Branch
        run: |
          echo "Moving current tokens to backup..."
          mv tokens/legacy/global tokens/global-pr-backup

          echo "Pulling token data from ${{ github.base_ref }}..."
          # The base branch may use either tokens/legacy/global (post-migration) or tokens/global (pre-migration)
          if git checkout origin/${{ github.base_ref }} -- tokens/legacy/global 2>/dev/null; then
            echo "Found tokens/legacy/global in base branch"
          elif git checkout origin/${{ github.base_ref }} -- tokens/global 2>/dev/null; then
            echo "Found tokens/global in base branch; relocating to tokens/legacy/global"
            mv tokens/global tokens/legacy/global
          else
            echo "No known token path in base branch"
            exit 1
          fi

          echo "Running baseline generation script..."
          npx tsx scripts/generate-baseline.ts

          echo "Restoring PR tokens..."
          rm -rf tokens/legacy/global
          mv tokens/global-pr-backup tokens/legacy/global

      # =======================================================================
      # STEP 3: STATIC ANALYSIS & GATES (Pre-Build)
      # =======================================================================
      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Enforce Canonical Module Contract
        run: npx tsx scripts/validate-contract.ts

      - name: Enforce Rename & Deletion Governance
        # This compares current tokens against the baseline.json created in Step 2
        run: npx tsx scripts/enforce-deletions.ts

      # =======================================================================
      # STEP 4: TEST & COMPILE
      # =======================================================================
      - name: Test
        run: pnpm test

      - name: Build Tokens
        run: pnpm build

      - name: Enforce ADR-0001 Contract
        # Validates dist/ modular output invariants from ADR-0001.
        # Runs against freshly-built dist. See src/contract/canonical-contract.test.ts.
        run: pnpm test:contract

      # =======================================================================
      # STEP 5: POST-BUILD PARITY CHECKS
      # =======================================================================
      - name: Validate Syntax Boundaries
        run: npx tsx scripts/validate-syntax-boundaries.ts

      - name: Validate Output Parity & Scope Leaks
        run: npx tsx scripts/validate-output-parity.ts

      # =======================================================================
      # STEP 6: POST-BUILD TYPE COMPILE CHECKS
      # =======================================================================

      - name: Consumer type compile check
        run: pnpm run test:consumer-types
