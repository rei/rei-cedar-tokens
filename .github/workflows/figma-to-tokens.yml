name: Sync Figma variables to tokens
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode (skips Figma sync, only builds)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Allow one run at a time so baselines never interleave
concurrency:
  group: figma-to-tokens
  cancel-in-progress: false

jobs:
  sync-figma-to-tokens:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write

    # The branch name used for the PR (and the GH Pages sub-path)
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      PR_BRANCH: update-tokens

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Clone repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # with:
        #   ref: ${{ env.BASE_BRANCH }}

      # ── 2. Toolchain ─────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 3. Baseline snapshot (BEFORE Figma sync) ─────────────────────────────
      - name: Build baseline snapshot
        run: pnpm tokens:snapshot baseline

      # ── 4. Figma → tokens sync ───────────────────────────────────────────────
      - name: Sync variables in Figma files to tokens
        if: github.event.inputs.debug != 'true'
        run: pnpm run sync:figma-to-tokens -- --output tokens
        env:
          FILE_KEYS: ${{ secrets.FIGMA_FILE_KEYS }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_ACTION_VARIABLES_SYNC_FIGMA_TOKEN }}
      - name: Debug sync failure
        if: failure() && github.event.inputs.debug != 'true'
        run: |
          echo "FILE_KEYS is set: $([ -n "$FILE_KEYS" ] && echo 'YES' || echo 'NO')"
          echo "PERSONAL_ACCESS_TOKEN is set: $([ -n "$PERSONAL_ACCESS_TOKEN" ] && echo 'YES' || echo 'NO')"
        env:
          FILE_KEYS: ${{ secrets.FIGMA_FILE_KEYS }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_ACTION_VARIABLES_SYNC_FIGMA_TOKEN }}

      # ── 5. Current snapshot (AFTER Figma sync) ───────────────────────────────
      - name: Build current snapshot
        run: pnpm tokens:snapshot current

      # ── 6. Build tokens (snapshots are baked in as static assets) ────────────
      - name: Build tokens
        run: pnpm build

      # ── 7. Build Storybook ───────────────────────────────────────────────────
      # STORYBOOK_BASE_URL tells Vite the sub-path it will be served from so
      # all asset references in the built HTML are correct.
      - name: Build Storybook
        run: pnpm build-storybook
        env:
          STORYBOOK_BASE_URL: /${{ github.event.repository.name }}/pr/${{ env.PR_BRANCH }}/

      # ── 8. Prepare GitHub Pages bundle ───────────────────────────────────────
      # GitHub Pages requires an index.html at the branch root when source is
      # set to /(root). We keep the PR preview under pr/update-tokens/ and add
      # a redirect at the root for convenience.
      - name: Stage GitHub Pages bundle
        run: |
          rm -rf gh-pages-site
          mkdir -p gh-pages-site/pr/${{ env.PR_BRANCH }}
          cp -rT storybook-static gh-pages-site/pr/${{ env.PR_BRANCH }}
          cat > gh-pages-site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=./pr/${{ env.PR_BRANCH }}/">
              <title>Token preview</title>
            </head>
            <body>
              <a href="./pr/${{ env.PR_BRANCH }}/">Token preview for ${{ env.PR_BRANCH }}</a>
            </body>
          </html>
          EOF

      # ── 9. Deploy Storybook preview to GitHub Pages under /pr/update-tokens/ ─
      - name: Deploy Storybook preview to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-site
          publish_branch: gh-pages
          keep_files: true

      # ── 8. Create (or update) the Pull Request ───────────────────────────────
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        env:
          HUSKY: 0
        with:
          commit-message: 'chore: update tokens from Figma'
          title: 'chore: update tokens from Figma'
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.PR_BRANCH }}
          body: |
            ## Token update from Figma

            Tokens have been synced from Figma. The diff snapshots are bundled
            into the Storybook preview linked below — open the **Live Diff** story
            to see exactly what changed between the old and new token values.

            ### Storybook preview

            | Story | Link |
            |-------|------|
            | Live Diff (old vs new) | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ env.PR_BRANCH }}/?path=/story/cedar-tokens-semantic-diff--live-diff |
            | Full token set | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr/${{ env.PR_BRANCH }}/ |

            > The preview is deployed to GitHub Pages and will be available a few
            > minutes after this workflow completes.
